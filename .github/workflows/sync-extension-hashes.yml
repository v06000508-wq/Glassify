name: Sync extension hashes

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate SHA-256 values
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          catalog_path = Path('catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          changed = False

          for ext in catalog.get('extensions', []):
              url = ext.get('file', '')
              parsed = urlparse(url)
              parts = parsed.path.lstrip('/').split('/')
              if parsed.netloc != 'raw.githubusercontent.com' or len(parts) < 4:
                  continue

              owner, repo, ref = parts[:3]
              rel = '/'.join(parts[3:])
              if owner != 'v06000508-wq' or repo != 'Glassify' or ref != 'main':
                  continue

              path = Path(rel)
              if not path.is_file():
                  continue

              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if ext.get('sha256') != digest:
                  ext['sha256'] = digest
                  changed = True
                  print(f"Updated {ext.get('id')}: {digest}")

          if changed:
              catalog_path.write_text(
                  json.dumps(catalog, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog hashes are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Sync extension SHA-256 hashes"
          git push
