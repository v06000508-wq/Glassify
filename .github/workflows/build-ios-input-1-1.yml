name: Build iOS Input 1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-input-1-1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify single DEX payload
        shell: python
        run: |
          import base64
          import hashlib
          import shutil
          import zlib
          from pathlib import Path

          root = Path('extensions/ios_input')
          parts = [
              root / '1.0/payload/00.b64',
              root / '1.0/payload/01.b64',
              root / '1.0/payload/02.b64',
              root / '1.0/payload/03.b64',
              root / '1.0/payload_split/04_0.b64',
              root / '1.0/payload_split/04_1.b64',
              root / '1.0/payload_split/04_2.b64',
              root / '1.0/payload_split/04_3.b64',
              root / '1.0/payload_split/04_4.b64',
              root / '1.0/payload_split/05_0.b64',
              root / '1.0/payload_split/05_1.b64',
              root / '1.0/payload_split/05_2.b64',
              root / '1.0/payload_split/05_3.b64',
              root / '1.0/payload_split/05_4.b64',
              root / '1.0/payload/06.b64',
              root / '1.0/payload/07.b64',
          ]
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          assert len(encoded) == 128364, f'unexpected payload length: {len(encoded)}'
          packed = base64.b64decode(encoded, validate=True)
          raw = zlib.decompress(packed)
          assert len(raw) == 211492, f'DEX size mismatch: {len(raw)}'
          expected = '4637973df7bd0b114ddc1d2dcc056554d58c2a9f3e9a00a4b6b50119928a9155'
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, f'DEX SHA-256 mismatch: {actual}'

          out = root / '1.1'
          (out / 'payload').mkdir(parents=True, exist_ok=True)
          (out / 'payload/all.b64').write_text(encoded, encoding='utf-8')
          shutil.copyfile(root / '1.0/preview.webp', out / 'preview.webp')

          source = '''GLASSIFY_EXTENSION = {
              "id": "ios_input",
              "name": "iOS Input",
              "version": "1.1",
              "api": 4,
          }

          _DEX_SHA256 = "4637973df7bd0b114ddc1d2dcc056554d58c2a9f3e9a00a4b6b50119928a9155"
          _DEX_SIZE = 211492
          _MAIN_CLASS_NAME = "com.swagaplugins.plugin.modulartweaks.module.ios_input_panel.ios_input_panel"
          _DEX_CHUNKS = [
              "https://raw.githubusercontent.com/v06000508-wq/Glassify/main/extensions/ios_input/1.1/payload/all.b64",
          ]

          _API = None
          _DEX_HANDLE = None

          _SETTINGS = [
              {
                  "type": "choice",
                  "key": "timer_ring",
                  "text": "Полоска таймера",
                  "icon": "msg_settings",
                  "default": "on",
                  "options": [
                      {"value": "on", "text": "Включено"},
                      {"value": "off", "text": "Выключено"},
                  ],
              },
              {
                  "type": "divider",
                  "text": "Оригинальный DEX-модуль iOS Input с проверкой SHA-256 и оптимизированной загрузкой.",
              },
          ]


          def _log(text):
              if _API is not None:
                  _API.log("iOS Input: " + str(text))


          def _timer_ring_get():
              if _API is None or _DEX_HANDLE is None:
                  return True
              try:
                  return bool(_API.call_embedded_dex(_DEX_HANDLE, "timerRingEnabled", []))
              except Exception:
                  return True


          def _timer_ring_set(enabled):
              if _API is None or _DEX_HANDLE is None:
                  return
              _API.call_embedded_dex(_DEX_HANDLE, "setTimerRingEnabled", [bool(enabled)])


          def _settings_changed(key, value):
              if key == "timer_ring":
                  _timer_ring_set(str(value) != "off")


          def on_load(api):
              global _API, _DEX_HANDLE
              _API = api
              _DEX_HANDLE = api.load_remote_dex(
                  _DEX_CHUNKS,
                  _DEX_SHA256,
                  _DEX_SIZE,
                  _MAIN_CLASS_NAME,
              )
              api.activate_embedded_dex(_DEX_HANDLE)
              _timer_ring_set(str(api.get_setting("timer_ring", "on")) != "off")
              api.register_settings(_SETTINGS, _settings_changed)
              _log("loaded; optimized single payload; timer ring=" + ("on" if _timer_ring_get() else "off"))


          def on_unload(api):
              global _API, _DEX_HANDLE
              if _DEX_HANDLE is not None:
                  try:
                      api.unload_embedded_dex(_DEX_HANDLE)
                  finally:
                      _DEX_HANDLE = None
              _API = None
          '''
          # Remove workflow indentation while keeping the extension source readable.
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines()) + '\n'
          (out / 'extension.py').write_text(source, encoding='utf-8')

      - name: Commit release and publish catalog entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/build-ios-input-1-1.yml
          git add extensions/ios_input/1.1
          git commit -m "Release iOS Input 1.1 optimized payload"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_BLOB="$(git hash-object extensions/ios_input/1.1/extension.py)"
          SOURCE_SHA="$(sha256sum extensions/ios_input/1.1/extension.py | awk '{print $1}')"
          PREVIEW_SHA="$(sha256sum extensions/ios_input/1.1/preview.webp | awk '{print $1}')"

          python - "$SOURCE_COMMIT" "$SOURCE_BLOB" "$SOURCE_SHA" "$PREVIEW_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          commit, blob, source_sha, preview_sha = sys.argv[1:5]
          path = Path('catalog.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))
          item = next(ext for ext in catalog['extensions'] if ext['id'] == 'ios_input')
          item.update({
              'name': 'iOS Input',
              'description': 'iOS-панель ввода для exteraGram на оригинальном DEX-модуле. В 1.1 загрузка объединена в один проверяемый payload для быстрого запуска.',
              'version': '1.1',
              'api': 4,
              'min_glassify': '0.4.0',
              'min_exteragram': '12.9.0',
              'file': 'https://raw.githubusercontent.com/v06000508-wq/Glassify/main/extensions/ios_input/1.1/extension.py',
              'preview': {
                  'file': 'https://raw.githubusercontent.com/v06000508-wq/Glassify/main/extensions/ios_input/1.1/preview.webp',
                  'sha256': preview_sha,
              },
              'sha256': source_sha,
              'commit': commit,
              'blob_sha': blob,
          })
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add catalog.json
          git commit -m "Publish iOS Input 1.1"
          git push
