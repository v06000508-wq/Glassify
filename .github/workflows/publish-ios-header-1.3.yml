name: Publish iOS Header 1.3

on:
  push:
    paths:
      - '.github/workflows/publish-ios-header-1.3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore release payload
        shell: bash
        run: |
          cat .tmp/ios_header_1.3.part1 .tmp/ios_header_1.3.part2 .tmp/ios_header_1.3.part3 | base64 -d | gzip -d > extensions/ios_header/1.3/extension.py
          python -m py_compile extensions/ios_header/1.3/extension.py
          python - <<'PY'
          from pathlib import Path
          text = Path('extensions/ios_header/1.3/extension.py').read_text('utf-8')
          assert '"version": "1.3"' in text
          assert 'setCommunityItemVisible' in text
          assert 'community_bottom = pill_bottom + self.plugin.dp(4)' in text
          assert 'timer_right = island_left + timer_overlap_x + self.plugin.dp(18)' in text
          PY
      - name: Commit stable release
        shell: bash
        run: |
          rm -f .tmp/ios_header_1.3.part1 .tmp/ios_header_1.3.part2 .tmp/ios_header_1.3.part3
          rm -f .github/workflows/publish-ios-header-1.3.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: iOS Header 1.3'
          git push origin HEAD:main
